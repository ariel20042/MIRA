<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מעקב שעות מילוי מקום - אמא</title>
    <!-- Google Fonts for a warm, clean, modern look -->
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #4A6B5B;
            --primary-light: #688F7D;
            --primary-bg: #F4F7F5;
            --accent: #D9A566;
            --accent-bg: #FCF7F0;
            --text-main: #2C3E35;
            --text-muted: #6C7A72;
            --bg-color: #FAF8F5;
            --card-bg: #FFFFFF;
            --border-color: #E3EDE6;
            --danger: #C06C54;
            --danger-bg: #FDF2F0;
            --radius: 16px;
            --shadow: 0 10px 30px rgba(74, 107, 91, 0.06);
            --transition: all 0.3s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Heebo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        /* Header */
        header {
            text-align: center;
            margin-bottom: 2.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-logo {
            height: 65px;
            width: auto;
            margin-bottom: 0.8rem;
            object-fit: contain;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.06));
            border-radius: 8px;
        }

        header h1 {
            font-size: 2.2rem;
            color: var(--primary);
            font-weight: 700;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        header h1 i {
            color: var(--accent);
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        /* Card / Section Base */
        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 2rem;
            margin-bottom: 2rem;
            border: 1px solid var(--border-color);
        }

        /* Summary Dashboard */
        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        @media (max-width: 600px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
        }

        .stat-card {
            background: var(--primary-bg);
            border-radius: var(--radius);
            padding: 1.5rem;
            text-align: center;
            border: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
        }

        .stat-card::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--primary);
        }

        .stat-card.accent::after {
            background: var(--accent);
        }

        .stat-card h3 {
            font-size: 1rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .stat-card .value {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--primary);
        }

        .stat-card.accent .value {
            color: #B8863A;
        }

        /* Quick Entry Form */
        .form-title {
            font-size: 1.3rem;
            color: var(--primary);
            margin-bottom: 1.2rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .entry-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .form-row {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        @media (max-width: 600px) {
            .form-row {
                flex-direction: column;
                align-items: stretch;
            }
        }

        .input-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .input-group label {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        .input-group input {
            padding: 0.8rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            transition: var(--transition);
            background: var(--bg-color);
            color: var(--text-main);
            width: 100%;
        }

        .input-group input:focus {
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(74, 107, 91, 0.1);
        }

        /* Note toggle & collapsible note */
        .note-toggle-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-icon-toggle {
            background: var(--primary-bg);
            border: 1px solid var(--border-color);
            color: var(--primary);
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            font-size: 1.2rem;
            margin-top: 1.6rem;
        }

        .btn-icon-toggle:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .btn-icon-toggle.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .note-field-container {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .note-field-container.show {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Buttons */
        .btn-primary {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.9rem 1.8rem;
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(74, 107, 91, 0.2);
            width: 100%;
            margin-top: 0.5rem;
        }

        .btn-primary:hover {
            background-color: var(--primary-light);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--primary);
            border: 1px solid var(--primary);
            padding: 0.6rem 1.2rem;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-secondary:hover {
            background-color: var(--primary-bg);
        }

        /* History & Table Section */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.2rem;
        }

        .section-header h2 {
            font-size: 1.3rem;
            color: var(--primary);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            max-height: 400px;
            overflow-y: auto;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
            background: white;
            font-size: 0.95rem;
        }

        th {
            background-color: var(--primary-bg);
            color: var(--primary);
            font-weight: 600;
            padding: 12px 16px;
            position: sticky;
            top: 0;
            z-index: 10;
            border-bottom: 1px solid var(--border-color);
        }

        td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-main);
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background-color: var(--bg-color);
        }

        .no-data {
            text-align: center;
            padding: 2.5rem;
            color: var(--text-muted);
            font-style: italic;
        }

        .btn-delete {
            background: none;
            border: none;
            color: var(--danger);
            cursor: pointer;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .btn-delete:hover {
            background-color: var(--danger-bg);
        }

        /* Monthly breakdown list */
        .monthly-breakdown {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px;
            margin-top: 1rem;
        }

        .month-chip {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 0.8rem;
            text-align: center;
        }

        .month-chip .month-name {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 0.2rem;
        }

        .month-chip .month-hours {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary);
        }

        /* Footer info */
        footer {
            text-align: center;
            margin-top: 1rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <header>
            <img src="ort-logo.jpg" alt="סמל אורט" class="header-logo">
            <h1>מעקב שעות מילוי מקום <i class="fa-solid fa-graduation-cap"></i></h1>
            <p>ניהול ומעקב שעות להגשה בסוף שנת הלימודים</p>
        </header>

        <!-- Quick Entry Form Card -->
        <div class="card">
            <div class="form-title"><i class="fa-solid fa-circle-plus"></i> הוספת שעות חדשות</div>
            <form class="entry-form" id="subForm">
                <div class="form-row">
                    <div class="input-group">
                        <label for="entryDate">תאריך</label>
                        <input type="date" id="entryDate" required>
                    </div>
                    <div class="input-group">
                        <label for="entryHours">מספר שעות</label>
                        <input type="number" id="entryHours" step="0.5" min="0.5" max="24" placeholder="לדוגמה: 1.5" required>
                    </div>
                    <div class="input-group" style="flex: 0 0 auto;">
                        <label style="visibility: hidden;">הערה</label>
                        <button type="button" class="btn-icon-toggle" id="toggleNoteBtn" title="הוסף הערה">
                            <i class="fa-solid fa-plus"></i>
                        </button>
                    </div>
                </div>

                <!-- Collapsible Note Field -->
                <div class="note-field-container" id="noteContainer">
                    <div class="input-group">
                        <label for="entryNote">הערה (שם כיתה, פרטים נוספים)</label>
                        <input type="text" id="entryNote" placeholder="לדוגמה: שעה 3-4, כיתה ט'2, ממלא מקום של רחל">
                    </div>
                </div>

                <button type="submit" class="btn-primary">
                    <i class="fa-solid fa-check"></i> הוספת שעות
                </button>
            </form>
        </div>

        <!-- Summary Dashboard -->
        <div class="dashboard">
            <div class="stat-card">
                <h3>סך הכל שעות שנצברו</h3>
                <div class="value" id="totalHours">0</div>
            </div>
            <div class="stat-card accent">
                <h3>חודשים פעילים</h3>
                <div class="value" id="activeMonths">0</div>
            </div>
        </div>

        <!-- Monthly Breakdown Summary Card -->
        <div class="card" id="monthlyCard" style="display: none;">
            <h3 style="font-size: 1.1rem; color: var(--primary); margin-bottom: 0.8rem; font-weight: 600;">
                <i class="fa-solid fa-chart-pie"></i> סיכום לפי חודשים
            </h3>
            <div class="monthly-breakdown" id="monthlyBreakdownList"></div>
        </div>

        <!-- History List Card -->
        <div class="card">
            <div class="section-header">
                <h2><i class="fa-solid fa-clock-rotate-left"></i> היסטוריית שעות</h2>
                <button type="button" class="btn-secondary" id="exportBtn" onclick="exportToTXT()">
                    <i class="fa-solid fa-file-lines"></i> הורדת דוח (TXT)
                </button>
            </div>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>תאריך</th>
                            <th>שעות</th>
                            <th>הערה</th>
                            <th style="width: 60px; text-align: center;">מחיקה</th>
                        </tr>
                    </thead>
                    <tbody id="entriesTableBody">
                        <!-- Populated by JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>

        <footer>
            נבנה באהבה עבור האמא הכי תותחית בארץ ❤️❤️
        </footer>
    </div>

    <script>
        // Hebrew month names mapping
        const hebrewMonths = [
            'ינואר', 'פברואר', 'מרץ', 'אפריל', 'מאי', 'יוני',
            'יולי', 'אוגוסט', 'ספטמבר', 'אוקטובר', 'נובמבר', 'דצמבר'
        ];

        // State
        let entries = JSON.parse(localStorage.getItem('sub_teaching_entries')) || [];

        // DOM Elements
        const subForm = document.getElementById('subForm');
        const entryDate = document.getElementById('entryDate');
        const entryHours = document.getElementById('entryHours');
        const entryNote = document.getElementById('entryNote');
        const toggleNoteBtn = document.getElementById('toggleNoteBtn');
        const noteContainer = document.getElementById('noteContainer');
        const entriesTableBody = document.getElementById('entriesTableBody');
        const totalHoursEl = document.getElementById('totalHours');
        const activeMonthsEl = document.getElementById('activeMonths');
        const monthlyCard = document.getElementById('monthlyCard');
        const monthlyBreakdownList = document.getElementById('monthlyBreakdownList');

        // Set default date to today
        function setDefaultDate() {
            const today = new Date().toISOString().split('T')[0];
            entryDate.value = today;
        }

        // Toggle Note Visibility
        toggleNoteBtn.addEventListener('click', () => {
            const isVisible = noteContainer.classList.toggle('show');
            toggleNoteBtn.classList.toggle('active', isVisible);
            if (!isVisible) {
                entryNote.value = ''; // clear when hidden
            } else {
                entryNote.focus();
            }
        });

        // Save to localStorage and update UI
        function saveData() {
            localStorage.setItem('sub_teaching_entries', JSON.stringify(entries));
            render();
        }

        // Add new entry
        subForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const date = entryDate.value;
            const hours = parseFloat(entryHours.value);
            const note = entryNote.value.trim();

            if (!date || isNaN(hours) || hours <= 0) return;

            const newEntry = {
                id: Date.now().toString(),
                date,
                hours,
                note
            };

            entries.unshift(newEntry); // Add to beginning
            saveData();

            // Reset form
            entryHours.value = '';
            entryNote.value = '';
            noteContainer.classList.remove('show');
            toggleNoteBtn.classList.remove('active');
            setDefaultDate();
        });

        // Delete entry
        function deleteEntry(id) {
            if (confirm('האם למשוך/למחוק רישום זה?')) {
                entries = entries.filter(entry => entry.id !== id);
                saveData();
            }
        }

        // Format Date to Israeli DD/MM/YYYY style
        function formatDateHebrew(dateString) {
            if (!dateString) return '';
            const parts = dateString.split('-');
            if (parts.length !== 3) return dateString;
            return `${parts[2]}.${parts[1]}.${parts[0]}`;
        }

        // Render everything
        function render() {
            // Sort entries by date descending
            entries.sort((a, b) => new Date(b.date) - new Date(a.date));

            // Clear table
            entriesTableBody.innerHTML = '';

            if (entries.length === 0) {
                entriesTableBody.innerHTML = `
                    <tr>
                        <td colspan="4" class="no-data">
                            <i class="fa-solid fa-inbox" style="font-size: 2rem; margin-bottom: 0.5rem; display: block; color: var(--border-color);"></i>
                            טרם הוזנו שעות. הזן את השעות הראשונות למעלה!
                        </td>
                    </tr>
                `;
                totalHoursEl.textContent = '0';
                activeMonthsEl.textContent = '0';
                monthlyCard.style.display = 'none';
                return;
            }

            // Calculate totals and monthly breakdown
            let total = 0;
            const monthlyData = {};

            entries.forEach(entry => {
                total += Number(entry.hours);

                // Extract YYYY-MM for grouping
                const [year, month] = entry.date.split('-');
                const monthKey = `${year}-${month}`;
                if (!monthlyData[monthKey]) {
                    monthlyData[monthKey] = {
                        year,
                        monthNum: parseInt(month, 10),
                        total: 0
                    };
                }
                monthlyData[monthKey].total += Number(entry.hours);

                // Create table row
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${formatDateHebrew(entry.date)}</strong></td>
                    <td><span style="background: var(--primary-bg); padding: 4px 10px; border-radius: 8px; font-weight: 600; color: var(--primary);">${entry.hours} ש'</span></td>
                    <td style="color: var(--text-muted);">${entry.note || '<span style="color: #ccc;">—</span>'}</td>
                    <td style="text-align: center;">
                        <button class="btn-delete" onclick="deleteEntry('${entry.id}')" title="מחיקה">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </td>
                `;
                entriesTableBody.appendChild(tr);
            });

            // Update Dashboard cards
            totalHoursEl.textContent = total % 1 === 0 ? total : total.toFixed(1);
            
            const activeMonthsKeys = Object.keys(monthlyData);
            activeMonthsEl.textContent = activeMonthsKeys.length;

            // Render monthly breakdown chips
            monthlyBreakdownList.innerHTML = '';
            activeMonthsKeys.sort().reverse().forEach(key => {
                const data = monthlyData[key];
                const monthName = hebrewMonths[data.monthNum - 1];
                const chip = document.createElement('div');
                chip.className = 'month-chip';
                chip.innerHTML = `
                    <div class="month-name">${monthName} ${data.year}</div>
                    <div class="month-hours">${data.total % 1 === 0 ? data.total : data.total.toFixed(1)} ש'</div>
                `;
                monthlyBreakdownList.appendChild(chip);
            });
            monthlyCard.style.display = 'block';
        }

        // Export to TXT file
        function exportToTXT() {
            if (entries.length === 0) {
                alert('אין נתונים לייצוא.');
                return;
            }

            // Sort chronologically from oldest to newest for the report
            const sortedEntries = [...entries].sort((a, b) => new Date(a.date) - new Date(b.date));

            let txtLines = [];

            sortedEntries.forEach(entry => {
                const formattedDate = formatDateHebrew(entry.date);
                const hours = entry.hours;
                const noteStr = entry.note && entry.note.trim() !== '' ? ` - ${entry.note.trim()}` : '';
                txtLines.push(`${formattedDate}: ${hours} שעות${noteStr}`);
            });

            // BOM (\uFEFF) for Hebrew support in Windows Notepad
            const txtContent = '\uFEFF' + txtLines.join('\r\n');

            const blob = new Blob([txtContent], { type: 'text/plain;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('href', url);
            a.setAttribute('download', `שעות_מילוי_מקום_${new Date().toISOString().split('T')[0]}.txt`);
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // Initial setup
        setDefaultDate();
        render();
    </script>
</body>
</html>
