<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מעקב שעות מילוי מקום - אמא</title>
    <!-- Google Fonts for a warm, clean, modern look -->
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="page-tag">ניהול ומעקב שעות להגשה בסוף שנת הלימודים</div>
    <div class="container">
        <!-- Header -->
        <header>
            <img src="ort-logo.jpg" alt="סמל אורט" class="header-logo">
            <h1>מעקב שעות מילוי מקום <i class="fa-solid fa-graduation-cap"></i></h1>
            <h2 class="welcome-heading">ברוכה הבאה מירה</h2>
        </header>

        <!-- Quick Entry Form Card -->
        <div class="card">
            <div class="form-title"><i class="fa-solid fa-circle-plus"></i> הוספת שעות חדשות</div>
            <form class="entry-form" id="subForm">
                <div class="form-row">
                    <div class="input-group">
                        <label for="entryDate">תאריך</label>
                        <input type="date" id="entryDate" required>
                    </div>
                    <div class="input-group">
                        <label for="entryHours">מספר שעות</label>
                        <input type="number" id="entryHours" step="0.5" min="0.5" max="24" placeholder="לדוגמה: 1.5" required>
                    </div>
                    <div class="input-group input-group--toggle">
                        <label class="invisible-label">הערה</label>
                        <button type="button" class="btn-icon-toggle" id="toggleNoteBtn" title="הוסף הערה">
                            <i class="fa-solid fa-plus"></i>
                        </button>
                    </div>
                </div>

                <!-- Collapsible Note Field -->
                <div class="note-field-container" id="noteContainer">
                    <div class="input-group">
                        <label for="entryNote">הערה (שם כיתה, פרטים נוספים)</label>
                        <input type="text" id="entryNote" placeholder="לדוגמה: שעה 3-4, כיתה ט'2, ממלא מקום של רחל">
                    </div>
                </div>

                <button type="submit" class="btn-primary">
                    <i class="fa-solid fa-check"></i> הוספת שעות
                </button>
            </form>
        </div>

        <!-- Summary Dashboard -->
        <div class="dashboard">
            <div class="stat-card">
                <h3>סך הכל שעות שנצברו</h3>
                <div class="value" id="totalHours">0</div>
            </div>
            <div class="stat-card accent">
                <h3>חודשים פעילים</h3>
                <div class="value" id="activeMonths">0</div>
            </div>
        </div>

        <!-- Monthly Breakdown Summary Card -->
        <div class="card is-hidden" id="monthlyCard">
            <h3 class="monthly-heading">
                <i class="fa-solid fa-chart-pie"></i> סיכום לפי חודשים
            </h3>
            <div class="monthly-breakdown" id="monthlyBreakdownList"></div>
        </div>

        <!-- History List Card -->
        <div class="card">
            <div class="section-header">
                <h2><i class="fa-solid fa-clock-rotate-left"></i> היסטוריית שעות</h2>
                <button type="button" class="btn-secondary" id="exportBtn">
                    <i class="fa-solid fa-file-lines"></i> הורדת דוח (TXT)
                </button>
            </div>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>תאריך</th>
                            <th>שעות</th>
                            <th>הערה</th>
                            <th class="delete-column">מחיקה</th>
                        </tr>
                    </thead>
                    <tbody id="entriesTableBody">
                        <!-- Populated by JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>

        <footer>
            נבנה באהבה עבור האמא הכי תותחית בארץ ❤️❤️
        </footer>
    </div>

    <script src="js/main.js" defer></script>
</body>
</html>
